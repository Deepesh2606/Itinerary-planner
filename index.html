<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Build Roadmap — Itinerary Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A1220;
    --panel: #101B2D;
    --panel-hover: #142238;
    --grid: rgba(94,234,212,0.06);
    --line: rgba(124,147,172,0.18);
    --text: #E6EEF6;
    --muted: #7C93AC;
    --accent: #5EEAD4;
    --accent-dim: rgba(94,234,212,0.15);
    --amber: #FBBF24;
    --done: #34D399;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 32px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 32px 100%,
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    padding: 28px 18px 60px;
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 22px;
  }

  .status-bar {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 28px;
  }
  .status-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .status-top span.count { color: var(--accent); }
  .bar-track {
    height: 6px;
    background: rgba(124,147,172,0.15);
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--done));
    width: 0%;
    transition: width 0.4s ease;
  }

  .phase {
    position: relative;
    padding-left: 34px;
    margin-bottom: 4px;
  }
  .phase::before {
    content: '';
    position: absolute;
    left: 10px;
    top: 30px;
    bottom: -4px;
    width: 1px;
    background: var(--line);
  }
  .phase:last-child::before { display: none; }

  .phase-node {
    position: absolute;
    left: 3px;
    top: 4px;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--muted);
    transition: border-color 0.3s, background 0.3s;
  }
  .phase.complete .phase-node {
    border-color: var(--done);
    background: var(--done);
  }
  .phase.active .phase-node {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  .phase-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    cursor: pointer;
    padding: 6px 0;
    user-select: none;
  }
  .phase-tag {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .phase-title {
    font-weight: 600;
    font-size: 15px;
  }
  .phase-frac {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  .chevron {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    transition: transform 0.2s;
  }
  .phase.open .chevron { transform: rotate(90deg); }

  .items {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }
  .phase.open .items { max-height: 900px; }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 10px;
    margin: 4px 0 4px 0;
    background: var(--panel);
    border: 1px solid transparent;
    border-radius: 5px;
    cursor: pointer;
  }
  .item:hover { background: var(--panel-hover); border-color: var(--line); }

  .checkbox {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    margin-top: 2px;
    border-radius: 4px;
    border: 1px solid var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--bg);
  }
  .item.checked .checkbox {
    background: var(--done);
    border-color: var(--done);
  }
  .item.checked .checkbox::after { content: '✓'; }

  .item-text { flex: 1; }
  .item-title {
    font-size: 13.5px;
    line-height: 1.4;
  }
  .item.checked .item-title {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: rgba(124,147,172,0.5);
  }
  .item-note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    line-height: 1.4;
  }

  .reset-row {
    margin-top: 30px;
    text-align: center;
  }
  .reset-btn {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    background: none;
    border: 1px solid var(--line);
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
  }
  .reset-btn:hover { color: var(--text); border-color: var(--muted); }

  @media (max-width: 480px) {
    h1 { font-size: 22px; }
    .phase { padding-left: 28px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">// build_log</div>
  <h1>Itinerary Planner — Build Roadmap</h1>
  <div class="sub">Learn-as-you-build order, phased against your 6-week timeline. Tap to check off.</div>

  <div class="status-bar">
    <div class="status-top">
      <span>OVERALL PROGRESS</span>
      <span><span class="count" id="doneCount">0</span> / <span id="totalCount">0</span> TASKS</span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
  </div>

  <div id="phases"></div>

  <div class="reset-row">
    <button class="reset-btn" id="resetBtn">RESET PROGRESS</button>
  </div>
</div>

<script>
const PHASES = [
  {
    id: 'p0',
    tag: 'PHASE 00 — BEFORE WEEK 1',
    title: 'Refresh Fundamentals',
    items: [
      { id: 'p0-1', t: 'JWT auth flow', n: 'Signup/login endpoints, protecting routes with middleware.' },
      { id: 'p0-2', t: 'Express middleware & error handling', n: 'Central error handler, try/catch in async routes.' },
      { id: 'p0-3', t: 'Mongoose schema design', n: 'Refs between User → Trip → ItineraryItem.' },
      { id: 'p0-4', t: 'Calling external APIs from Node', n: 'fetch/axios, handling failures and rate limits gracefully.' },
    ]
  },
  {
    id: 'p1',
    tag: 'PHASE 01 — WEEK 1',
    title: 'Foundation',
    items: [
      { id: 'p1-1', t: 'Express + MongoDB connection set up', n: '' },
      { id: 'p1-2', t: 'User / Trip / Place schemas built', n: '' },
      { id: 'p1-3', t: 'JWT auth endpoints working', n: '' },
      { id: 'p1-4', t: 'Google Places API key obtained, test call working', n: 'Cache responses locally — do not re-call on every request.' },
      { id: 'p1-5', t: 'React app shell + routing', n: '' },
    ]
  },
  {
    id: 'p2',
    tag: 'PHASE 02 — WEEK 2',
    title: 'Core Algorithm I — Clustering & Routing',
    items: [
      { id: 'p2-1', t: 'Understand k-means clustering', n: 'Know why it groups attractions geographically, not just what the code does.' },
      { id: 'p2-2', t: 'Implement day-wise clustering', n: 'Reuse/extend the sample optimizer code.' },
      { id: 'p2-3', t: 'Understand nearest-neighbour + 2-opt (TSP)', n: 'Be able to explain why 2-opt improves a route — viva-critical.' },
      { id: 'p2-4', t: 'Unit-test optimizer standalone', n: 'Before wiring it into the API, test with sample data.' },
    ]
  },
  {
    id: 'p3',
    tag: 'PHASE 03 — WEEK 3',
    title: 'Constraints Layer',
    items: [
      { id: 'p3-1', t: 'Opening-hours filtering', n: '' },
      { id: 'p3-2', t: 'Greedy knapsack-style time/budget fitting', n: 'Understand the core knapsack idea, not just the greedy shortcut.' },
      { id: 'p3-3', t: '"Regenerate this day" endpoint', n: 'Re-run optimizer for one day only, keep others untouched.' },
    ]
  },
  {
    id: 'p4',
    tag: 'PHASE 04 — WEEK 4',
    title: 'Weather-Awareness & UI',
    items: [
      { id: 'p4-1', t: 'OpenWeather API integration', n: '' },
      { id: 'p4-2', t: 'Rule-based outdoor → indoor swap logic', n: '' },
      { id: 'p4-3', t: 'Itinerary UI — day tabs, stop cards', n: '' },
      { id: 'p4-4', t: 'Map view (Leaflet + OpenStreetMap)', n: 'Free, simpler to learn than Google Maps JS SDK.' },
    ]
  },
  {
    id: 'p5',
    tag: 'PHASE 05 — WEEK 5',
    title: 'Save, Fallback & Polish',
    items: [
      { id: 'p5-1', t: 'Save / edit trips (CRUD)', n: '' },
      { id: 'p5-2', t: 'Instagram deep-link fallback', n: 'Legal link-out, not API scraping.' },
      { id: 'p5-3', t: 'Loading states & error handling polish', n: '' },
    ]
  },
  {
    id: 'p6',
    tag: 'PHASE 06 — WEEK 6',
    title: 'Finish',
    items: [
      { id: 'p6-1', t: 'Full testing & bug fixes', n: '' },
      { id: 'p6-2', t: 'Write project report', n: '' },
      { id: 'p6-3', t: 'Rehearse demo end-to-end', n: 'Pre-cache demo cities so live API calls do not fail on stage.' },
    ]
  },
];

let checked = new Set();
let openPhase = 'p0';

function loadProgress() {
  try {
    const raw = localStorage.getItem('roadmap-progress');
    if (raw) checked = new Set(JSON.parse(raw));
  } catch (e) { /* no saved progress yet, or storage blocked */ }
  render();
}

function saveProgress() {
  try {
    localStorage.setItem('roadmap-progress', JSON.stringify([...checked]));
  } catch (e) { console.error('Could not save progress', e); }
}

function toggleItem(id) {
  if (checked.has(id)) checked.delete(id); else checked.add(id);
  saveProgress();
  render();
}

function togglePhase(id) {
  openPhase = (openPhase === id) ? null : id;
  render();
}

function render() {
  const container = document.getElementById('phases');
  container.innerHTML = '';

  let totalAll = 0, doneAll = 0;

  PHASES.forEach(phase => {
    const total = phase.items.length;
    const done = phase.items.filter(i => checked.has(i.id)).length;
    totalAll += total; doneAll += done;

    const isOpen = openPhase === phase.id;
    const isComplete = done === total;
    const isActive = done > 0 && !isComplete;

    const phaseEl = document.createElement('div');
    phaseEl.className = 'phase' + (isOpen ? ' open' : '') + (isComplete ? ' complete' : '') + (isActive ? ' active' : '');

    phaseEl.innerHTML = `
      <div class="phase-node"></div>
      <div class="phase-head" data-phase="${phase.id}">
        <span class="phase-tag">${phase.tag}</span>
        <span class="phase-title">${phase.title}</span>
        <span class="phase-frac">${done}/${total}</span>
        <span class="chevron">›</span>
      </div>
      <div class="items">
        ${phase.items.map(item => `
          <div class="item ${checked.has(item.id) ? 'checked' : ''}" data-item="${item.id}">
            <div class="checkbox"></div>
            <div class="item-text">
              <div class="item-title">${item.t}</div>
              ${item.n ? `<div class="item-note">${item.n}</div>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    `;
    container.appendChild(phaseEl);
  });

  document.getElementById('doneCount').textContent = doneAll;
  document.getElementById('totalCount').textContent = totalAll;
  document.getElementById('barFill').style.width = (totalAll ? (doneAll / totalAll * 100) : 0) + '%';

  container.querySelectorAll('.phase-head').forEach(el => {
    el.addEventListener('click', () => togglePhase(el.dataset.phase));
  });
  container.querySelectorAll('.item').forEach(el => {
    el.addEventListener('click', () => toggleItem(el.dataset.item));
  });
}

document.getElementById('resetBtn').addEventListener('click', () => {
  checked = new Set();
  saveProgress();
  render();
});

loadProgress();
</script>
</body>
</html>
